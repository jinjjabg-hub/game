<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>팀한판 — 폰으로 하는 팀 대항 게임</title>
<link rel="stylesheet" href="style.css">
<style>
  main { max-width: 1080px; margin: 0 auto; padding: 48px 20px; }
  .brand { font-size: 44px; text-align: center; }
  .lead { text-align: center; color: var(--soft); font-weight: 600; margin: 6px 0 36px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(270px, 1fr)); gap: 18px; }
  .card { display: flex; flex-direction: column; }
  .card h2 { font-size: 26px; margin: 8px 0 6px; }
  .card .ico { font-size: 44px; }
  .card p { color: var(--soft); font-weight: 500; flex: 1; }
  .card .btn { margin-top: 14px; width: 100%; }
  .card .btn[disabled] { opacity: .4; cursor: not-allowed; }
  .tag { display: inline-block; font-size: 12px; font-weight: 800; padding: 2px 8px; border-radius: 999px; background: #c9f2e3; color: #0b5a48; }
  .tag.srv { background: #ffe1e1; color: #8a1420; }
  #resume, #why { margin-top: 10px; font-size: 14px; }
  #resume a { color: var(--red); font-weight: 800; }
</style>
</head>
<body>
<main>
  <h1 class="brand">팀<b>한판</b></h1>
  <p class="lead">오늘은 무엇을 진행할까요?</p>
  <div class="grid">
    <section class="card">
      <div class="ico">📺</div>
      <span><span class="tag">바로 사용</span></span>
      <h2>한 화면 게임</h2>
      <p>폰 없이 큰 화면 하나로 진행해요. BNI 퀴즈, 딱 10초, 점수판, 최종 발표.</p>
      <a class="btn red" href="solo.html">한 화면 게임 열기 →</a>
    </section>
    <section class="card">
      <div class="ico">🎁</div>
      <span><span class="tag">바로 사용</span></span>
      <h2>경품 추첨</h2>
      <p>이름이나 번호만 넣으면 끝. 이름 룰렛·달리기 경주·돌림판·카드 뒤집기로 당첨자를 뽑아요.</p>
      <a class="btn" href="draw.html">추첨 열기 →</a>
    </section>
    <section class="card">
      <div class="ico">🏁</div>
      <span><span class="tag srv" id="tag">서버 확인 중…</span></span>
      <h2>폰 접속 게임</h2>
      <p>참가자가 폰으로 QR을 찍고 팀을 골라 겨뤄요. 연타·흔들기처럼 폰으로 조작하는 게임.</p>
      <button class="btn" id="new" disabled>새 행사 시작 →</button>
      <div id="resume"></div>
      <div id="why" class="muted"></div>
    </section>
  </div>
</main>
<script>
// 진행자 열쇠는 이 브라우저에만 저장 → 노트북이 꺼져도 같은 브라우저로 이어서 진행
const KEY = "hanpan_rooms";
const saved = JSON.parse(localStorage.getItem(KEY) || "{}");
const $ = (id) => document.getElementById(id);

// 폰 접속 게임은 폰과 큰 화면을 이어 주는 서버가 있어야 한다.
// GitHub Pages처럼 파일만 보여 주는 곳에서는 서버가 없으므로 버튼을 잠근다.
fetch("api/ping").then((r) => (r.ok ? r.json() : Promise.reject())).then(() => {
  $("tag").textContent = "사용 가능"; $("tag").className = "tag";
  $("new").disabled = false;
  const codes = Object.keys(saved);
  if (codes.length) {
    const last = codes[codes.length - 1];
    $("resume").innerHTML = `진행하던 행사가 있어요 · <a href="host.html?r=${last}">이어서 진행 (${last})</a>`;
  }
}).catch(() => {
  $("tag").textContent = "서버 필요";
  $("why").textContent = "이 주소에는 실시간 서버가 없어 폰 접속 게임은 쓸 수 없어요. 서버에 배포한 주소에서 열어 주세요.";
});

$("new").onclick = async () => {
  const r = await (await fetch("api/room", { method: "POST" })).json();
  saved[r.code] = r.key;
  localStorage.setItem(KEY, JSON.stringify(saved));
  location.href = "host.html?r=" + r.code;
};
</script>
</body>
</html>
